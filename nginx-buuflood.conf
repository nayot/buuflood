# nginx include for BUU Flood — save as /etc/nginx/includes/buuflood.conf
# and add to the eng-ai.buu.ac.th server block:  include /etc/nginx/includes/buuflood.conf;

location = /buuflood {
    return 301 /buuflood/;
}

location /buuflood/ {
    proxy_pass         http://127.0.0.1:3011/;   # trailing slash strips the /buuflood prefix
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 40m;                  # up to 10 photos per visit
}
